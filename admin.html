
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Servicing Admin</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5f9;
 color:#1e293b;
}
header{
 background:#0f172a;
 color:white;
 padding:18px;
 text-align:center;
}
.container{
 max-width:1000px;
 margin:auto;
 padding:15px;
}
.card{
 background:white;
 padding:20px;
 border-radius:12px;
 margin-bottom:15px;
 box-shadow:0 3px 10px #0001;
}
input,button{
 width:100%;
 padding:12px;
 margin:7px 0;
 border-radius:7px;
 border:1px solid #ddd;
 font-size:16px;
}
button{
 background:#2563eb;
 color:white;
 border:none;
 cursor:pointer;
}
.logout{background:#dc2626}
.green{background:#16a34a}
.red{background:#dc2626}
.hidden{display:none}
.booking{
 border:1px solid #ddd;
 padding:12px;
 border-radius:10px;
 margin:10px 0;
}
</style>
</head>

<body>

<header>
<h2>🛠 Local Servicing Admin</h2>
<p>Admin Control Panel</p>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
<h3>🔐 Admin Login</h3>

<input type="email" id="email" placeholder="Admin Gmail">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="message"></p>
</div>

<!-- DASHBOARD -->
<div id="adminPanel" class="hidden">

<div class="card">
<h3>স্বাগতম Admin</h3>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>📋 সার্ভিসিং বুকিং</h3>
<button onclick="loadBookings()">Booking Refresh</button>
<div id="bookingList">Booking লোড হচ্ছে...</div>
</div>

</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 doc,
 updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// আপনার Firebase Config
const firebaseConfig = {
 apiKey:"AIzaSyAzlIrVn9FrsBDNNDoCvRCU1bHxSNtEzhY",
 authDomain:"project-be074433-8fce-4dc9-bd7.firebaseapp.com",
 projectId:"project-be074433-8fce-4dc9-bd7",
 storageBucket:"project-be074433-8fce-4dc9-bd7.firebasestorage.app",
 messagingSenderId:"678442800678",
 appId:"1:678442800678:web:dc364fe500d9c3e37af8e7"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

window.login=async function(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;

 try{
  await signInWithEmailAndPassword(auth,email,password);
 }catch(error){
  document.getElementById("message").innerText=error.message;
 }
};

window.logout=async function(){
 await signOut(auth);
};

onAuthStateChanged(auth,async user=>{
 if(user){
  // এখানে Admin অনুমতি যাচাই করা হবে
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  loadBookings();
 }else{
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("adminPanel").classList.add("hidden");
 }
});

window.loadBookings=async function(){
 const list=document.getElementById("bookingList");
 list.innerHTML="লোড হচ্ছে...";

 try{
  const snapshot=await getDocs(collection(db,"bookings"));
  list.innerHTML="";

  if(snapshot.empty){
   list.innerHTML="কোনো Booking নেই";
   return;
  }

  snapshot.forEach(d=>{
   const b=d.data();

   const div=document.createElement("div");
   div.className="booking";

   div.innerHTML=`
   <h3>${b.name||"নাম নেই"}</h3>
   <p>📞 ${b.phone||""}</p>
   <p>🛠 ${b.service||""}</p>
   <p>📍 ${b.address||""}</p>
   <p>💰 ${b.paymentMethod||""}</p>
   <p>Transaction ID: ${b.transactionId||""}</p>
   <p>Status: ${b.status||"Pending"}</p>
   <button class="green" onclick="approveBooking('${d.id}')">Approve</button>
   <button class="red" onclick="rejectBooking('${d.id}')">Reject</button>
   `;

   list.appendChild(div);
  });

 }catch(error){
  list.innerHTML="Error: "+error.message;
 }
};

window.approveBooking=async function(id){
 try{
  await updateDoc(doc(db,"bookings",id),{
   status:"Approved"
  });
  alert("Booking Approved");
  loadBookings();
 }catch(error){
  alert(error.message);
 }
};

window.rejectBooking=async function(id){
 try{
  await updateDoc(doc(db,"bookings",id),{
   status:"Rejected"
  });
  alert("Booking Rejected");
  loadBookings();
 }catch(error){
  alert(error.message);
 }
};

</script>

</body>
</html>
